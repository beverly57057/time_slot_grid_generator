[project]
name = "time-slot-grid-generator"
version = "0.1.1"
description = "Creates fixed-interval datetime slots between two bounds, omitting blackout ranges."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
